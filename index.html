<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f1f3f4">
    <meta name="description" content="ステータス、2026年11月14日までに実装されたスキル、条件付き行動を組み合わせるLost Arcadia戦闘検証ツール。">
    <title>ロスアカ Battle Lab Web v1.17.1｜闘技趣味レーター</title>
    <script>
      // Apply saved appearance before styles render to avoid a light-mode flash.
      try { document.documentElement.dataset.theme = localStorage.getItem('battle-lab-theme') === 'dark' ? 'dark' : 'light'; }
      catch { document.documentElement.dataset.theme = 'light'; }
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#151c24' : '#f1f3f4');
    </script>
    <link rel="stylesheet" href="style.css?v=1.17.1">
    <link rel="stylesheet" href="style-simple.css?v=1.17.1">
    <link rel="stylesheet" href="style-dark.css?v=1.17.1">
    <link rel="stylesheet" href="style-mobile.css?v=1.17.1">
    <link rel="stylesheet" href="update-notice.css?v=1.17.1">
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status"></div>
    <dialog id="update-notice" class="update-notice" aria-labelledby="update-notice-title" aria-describedby="update-notice-message">
      <div class="update-notice-content">
        <div class="update-notice-kicker">Battle Lab アップデート</div>
        <h2 id="update-notice-title">新しいバージョンがあります</h2>
        <p id="update-notice-message">バージョンが更新されました。リロードしてください。</p>
        <p id="update-notice-versions" class="update-notice-versions" aria-live="polite"></p>
        <p class="update-notice-hint">未保存の編集内容がある場合は、先に保存してください。自動でリロードすることはありません。</p>
        <div class="update-notice-actions">
          <button type="button" id="update-notice-later">あとで</button>
          <button type="button" id="update-notice-reload">リロードする</button>
        </div>
      </div>
    </dialog>
    <dialog id="modal"></dialog>
    <dialog id="map-dialog" class="map-dialog" aria-label="戦闘マップの拡大表示">
      <div class="map-dialog-heading">
        <h2>戦闘マップ・拡大表示</h2>
        <button type="button" data-act="map-dialog-close" aria-label="拡大マップを閉じる">閉じる ×</button>
      </div>
      <div id="map-dialog-content"></div>
      <p class="map-dialog-note">＋／－で拡大・縮小。拡大中はマップをドラッグして移動できます。距離線は戦闘リプレイの現在時点に連動します。</p>
    </dialog>
    <input id="character-json-import" type="file" accept="application/json,.json" hidden>
    <input id="unit-tactics-import" type="file" accept="application/json,.json" hidden>
    <input id="arena-html-import" type="file" accept="text/html,.html,.htm" hidden>
    <script type="module" src="app.js?v=1.17.1"></script>
    <script type="module" src="version-check.js?v=1.17.1"></script>
  </body>
</html>
