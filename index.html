<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f1f3f4">
    <meta name="description" content="ステータス、2026年11月14日までに実装されたスキル、条件付き行動を組み合わせるLost Arcadia戦闘検証ツール。">
    <title>ロスアカ Battle Lab Web v1.6.24｜闘技趣味レーター</title>
    <link rel="stylesheet" href="style.css?v=skill-list-20261114">
    <link rel="stylesheet" href="style-simple.css?v=skill-list-20261114">
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status"></div>
    <dialog id="modal"></dialog>
    <dialog id="map-dialog" class="map-dialog" aria-label="戦闘マップの拡大表示">
      <div class="map-dialog-heading">
        <h2>戦闘マップ・拡大表示</h2>
        <button type="button" data-act="map-dialog-close" aria-label="拡大マップを閉じる">閉じる ×</button>
      </div>
      <div id="map-dialog-content"></div>
      <p class="map-dialog-note">＋／－で拡大・縮小。拡大中はマップをドラッグして移動できます。距離線は戦闘リプレイの現在時点に連動します。</p>
    </dialog>
    <input id="character-json-import" type="file" accept="application/json,.json" hidden>
    <input id="unit-tactics-import" type="file" accept="application/json,.json" hidden>
    <input id="arena-html-import" type="file" accept="text/html,.html,.htm" hidden>
    <script type="module" src="app.js?v=skill-list-20261114"></script>
  </body>
</html>
